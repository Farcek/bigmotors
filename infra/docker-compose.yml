name: bigmotors

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bigmotors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bigmotors_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bigmotors"]
      interval: 10s
      timeout: 5s
      retries: 5

  sysop-server:
    build:
      context: ..
      dockerfile: sysop/server/Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/bigmotors
      USERLY_ISSUER_URL: ${USERLY_ISSUER_URL:-}
      USERLY_CLIENT_ID: ${USERLY_CLIENT_ID:-}
      USERLY_CLIENT_SECRET: ${USERLY_CLIENT_SECRET:-}
      USERLY_ACL_AUDIENCE: ${USERLY_ACL_AUDIENCE:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_OPTIONS: ${LOG_OPTIONS:-}
      LOG_FILE_PATH: ${LOG_FILE_PATH:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  website:
    build:
      context: ..
      dockerfile: web/website/Dockerfile
      target: runner
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "5173:80"
    depends_on:
      sysop-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bigmotors_pgdata:
