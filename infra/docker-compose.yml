name: bigmotors

services:
  demo-import:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: sysop/server/Dockerfile.demo
      target: runner
    environment:
      DEMO_API_BASE_URL: http://sysop-server:4000
      FILE_UPLOAD_MAX_BYTES: ${FILE_UPLOAD_MAX_BYTES:-20971520}
    depends_on:
      sysop-server:
        condition: service_healthy
    init: true
    restart: "no"

  bigmotors-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bigmotors}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-64401}:5432"
    volumes:
      - ${PGDATA_PATH:-./.docker/bigmotors_pgdata}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bigmotors-migration:
    build:
      context: ..
      dockerfile: packages/db/Dockerfile
      target: runner
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@bigmotors-db:5432/${POSTGRES_DB:-bigmotors}}}
    depends_on:
      bigmotors-db:
        condition: service_healthy
    restart: "no"

  sysop-server:
    build:
      context: ..
      dockerfile: sysop/server/Dockerfile
      target: runner
    environment:
      NODE_ENV: ${SYSOP_NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@bigmotors-db:5432/${POSTGRES_DB:-bigmotors}}
      FILES_ROOT: /files
      FILES_UPLOADS: /files/uploads
      FILE_UPLOAD_MAX_BYTES: ${FILE_UPLOAD_MAX_BYTES:-20971520}
    ports:
      - "127.0.0.1:${SYSOP_SERVER_PORT:-64402}:4000"
    volumes:
      - ${FILES_DATA_PATH:-./.docker/files}:/files
    depends_on:
      bigmotors-migration:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  sysop-app:
    build:
      context: ..
      dockerfile: sysop/app/Dockerfile
      target: runner
    ports:
      - "127.0.0.1:${SYSOP_APP_PORT:-64403}:8080"
    depends_on:
      sysop-server:
        condition: service_healthy
    restart: unless-stopped

  website:
    build:
      context: ..
      dockerfile: web/website/Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@bigmotors-db:5432/${POSTGRES_DB:-bigmotors}}
      FILES_ROOT: /files
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-64400}:3000"
    volumes:
      - ${FILES_DATA_PATH:-./.docker/files}:/files:ro
    depends_on:
      bigmotors-migration:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
