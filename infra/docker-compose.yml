name: bigmotors

services:
  bigmotors-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bigmotors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "64401:5432"
    volumes:
      - ./.docker/bigmotors_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bigmotors"]
      interval: 10s
      timeout: 5s
      retries: 5

  bigmotors-migration:
    build:
      context: ..
      dockerfile: packages/db/Dockerfile
      target: runner
    environment:
      # Local default only; inject a dedicated migration credential in production.
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:-postgresql://postgres:postgres@bigmotors-db:5432/bigmotors}
    depends_on:
      bigmotors-db:
        condition: service_healthy
    restart: "no"

