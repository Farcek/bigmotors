worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Runtime envsubst only expands the two uppercase environment variables.
    # Accept an origin with an optional trailing slash, never an /api prefix.
    map "${SYSOP_API_BASE_URL}" $api {
        default "";
        '~^(?<sysop_origin>https?://(?:[A-Za-z0-9][A-Za-z0-9.-]*|\[[0-9A-Fa-f:]+\])(?::[0-9]+)?)/?$' $sysop_origin;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # 20 MiB upload plus multipart fields and headers.
        client_max_body_size 21m;
        add_header X-Content-Type-Options nosniff always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"@bigmotors/sysop-app"}';
        }

        location ~ ^/(api|files)(/|$) {
            # Use the container's DNS, including Railway IPv6 private networking.
            resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
            resolver_timeout 5s;
            if ($api = "") { return 502; }
            proxy_pass $api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
